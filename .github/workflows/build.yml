name: aion-ui-build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag upstream, mis. v2.2.2"
        required: true
        default: "v2.2.2"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: iOfficeAI/AionUi
          ref: ${{ inputs.ref }}

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Dockerfile for Bun workspace install
        run: |
          if [ -f Dockerfile ] && [ -d packages ] && grep -q "RUN bun install --ignore-scripts" Dockerfile; then
            if ! grep -q "^COPY packages/ ./packages/$" Dockerfile; then
              sed -i '/RUN bun install --ignore-scripts/i COPY packages/ ./packages/' Dockerfile
            fi
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER }}/aionui:${{ inputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
